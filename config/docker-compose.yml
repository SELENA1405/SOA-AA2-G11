services:
  frontend:
    image: nginx:stable-alpine
    ports: ["8080:80"]
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
  backend:
    build:
      context: ..
      dockerfile: config/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-scenario_starter}
    ports: ["8000:8000"]
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scenario_starter}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - scenario-data:/var/lib/postgresql
      - ../database/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ../database/002-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
volumes:
  scenario-data: